# One-shot authentication management without the network authentication provider.

- insert:
    - id: auth-startup
      name: '@deepseek-ai/dsh-auth-app/startup'

    - id: auth-runner
      name: '@deepseek-ai/dsh-auth-app'
      inject: [authStartup]
      config:
        operation: !!js ctx.authStartup.operation
        name: !!js ctx.authStartup.name
        publicKey: !!js ctx.authStartup.publicKey
        profile: !!js ctx.authStartup.profile
        capabilities: !!js ctx.authStartup.capabilities
        dshHome: !!js process.env.DSH_HOME

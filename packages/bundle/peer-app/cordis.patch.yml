# One-shot peer pairing management without the serving composition.

- insert:
    - id: peer-startup
      name: '@deepseek-ai/dsh-peer-app/startup'

    - id: remote-hosts-ssh
      name: '@deepseek-ai/dsh-remote-hosts-ssh'

    # Read-only settlement-ledger access for `dsh peer outbox`: the same
    # storage composition the serving instance writes through; this app only
    # opens the domain to list entries and never writes.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: peer-runner
      name: '@deepseek-ai/dsh-peer-app'
      inject: [peerStartup, remoteHostSsh, storageDomain]
      config:
        operation: !!js ctx.peerStartup.operation
        uri: !!js ctx.peerStartup.uri
        endpoint: !!js ctx.peerStartup.endpoint
        displayName: !!js ctx.peerStartup.displayName
        ttl: !!js ctx.peerStartup.ttl
        fingerprint: !!js ctx.peerStartup.fingerprint
        sshHost: !!js ctx.peerStartup.sshHost
        instanceId: !!js ctx.peerStartup.instanceId
        timeoutMs: !!js ctx.peerStartup.timeoutMs
        prompt: !!js ctx.peerStartup.prompt
        sessionId: !!js ctx.peerStartup.sessionId
        cwd: !!js ctx.peerStartup.cwd
        profile: !!js ctx.peerStartup.profile
        messageId: !!js ctx.peerStartup.messageId
        surface: !!js ctx.peerStartup.surface
        async: !!js ctx.peerStartup.async
        attach: !!js ctx.peerStartup.attach
        path: !!js ctx.peerStartup.path
        out: !!js ctx.peerStartup.out
        dshHome: !!js process.env.DSH_HOME

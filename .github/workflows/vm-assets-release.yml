# Build and publish the VM world boot assets (kernel, initramfs, host wrapper)
# for `@deepseek-ai/dsh-vm-qemu-local`. The release carries the three files plus
# a `sha256sum -c` manifest; `ASSETS_MANIFEST_SHA256` in
# `packages/vm/vm-qemu-local/src/release.ts` pins the manifest digest, and the
# manifest pins every file digest. Rehearsal and publication build the same
# bytes from the same digest-pinned inputs.
name: VM Assets Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (must match vm-assets-v*); build-only when empty.
        required: false
        type: string
      publish:
        description: Publish the built assets to the GitHub Release for the tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Report toolchain
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools cpio

      - name: Build world assets
        run: bash packages/vm/vm-qemu-local/assets/build-rootfs.sh vm-assets-out

      - name: Write and verify the manifest
        run: |
          cd vm-assets-out
          sha256sum initramfs.cpio.gz qemu-wrap vmlinuz-virt > assets-manifest.sha256
          sha256sum -c assets-manifest.sha256
          echo "manifest digest to pin in packages/vm/vm-qemu-local/src/release.ts:"
          sha256sum assets-manifest.sha256

      - name: Upload assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: vm-assets
          path: vm-assets-out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse non-canonical tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^vm-assets-v[0-9]+$ ]] || { echo "tag must match vm-assets-v* (got: $TAG)" >&2; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          name: vm-assets
          path: vm-assets-out

      - name: Verify artifact manifest
        run: |
          cd vm-assets-out
          sha256sum -c assets-manifest.sha256

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          manifest_digest=$(sha256sum vm-assets-out/assets-manifest.sha256 | cut -d' ' -f1)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "VM world assets ${TAG#vm-assets-v}" \
            --notes "Boot assets for \`@deepseek-ai/dsh-vm-qemu-local\` (QEMU micro-VM execution world).

          - \`vmlinuz-virt\` — Alpine virt kernel from the digest-pinned \`linux-virt\` apk
          - \`initramfs.cpio.gz\` — minirootfs + musl guest agent + \`dsh-vm-confine\` + virtio_blk module + bash chain
          - \`qemu-wrap\` — host hardening wrapper (Landlock + uid drop + rlimits), Linux x86_64
          - \`assets-manifest.sha256\` — \`sha256sum -c\` manifest over the three files

          Source pins the manifest digest (\`ASSETS_MANIFEST_SHA256\` in \`packages/vm/vm-qemu-local/src/release.ts\`); the manifest pins every file digest.

          Manifest digest: \`$manifest_digest\`" \
            vm-assets-out/initramfs.cpio.gz \
            vm-assets-out/qemu-wrap \
            vm-assets-out/vmlinuz-virt \
            vm-assets-out/assets-manifest.sha256

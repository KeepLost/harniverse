# The pwsh terminal-card lane swaps the shipped bash stack for the PowerShell
# twin: the sandbox executors are disabled (patches cannot rename a row — `name`
# is a guard), the existing pwsh tool row is enabled, and the local pwsh
# executor is inserted. The permission preset service remains composed because
# the Standard Profile requires it when creating the fresh navigation Session;
# this lane renders a seeded call and never executes the unconfined provider.
# The seeded scenario renders the logged pwsh call/result
# through the real tools on replay; no command executes, but the composition
# must boot the pwsh executor, so the lane skips on hosts without a usable
# `pwsh`.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: true
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false
- insert:
    - id: pwsh-local
      name: '@deepseek-ai/dsh-pwsh-local'

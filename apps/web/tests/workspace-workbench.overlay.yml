# The workbench golden pins the open-in-default-application affordances. The
# gateway's nativeOpen flag makes that capability deterministic instead of
# display-detecting, so a headless CI runner and a desktop coauthor capture
# the same accessibility tree.
- id: api-gateway
  config:
    nativeOpen: true
# This suite pins the READ-ONLY workbench composition: with the optional
# ui-workspace-editor row disabled, editable families keep their read-only
# renderers byte-identically, which is exactly the fallback contract this
# golden asserts. The editor-visible path has its own package specs.
- id: ui-workspace-editor
  disabled: true

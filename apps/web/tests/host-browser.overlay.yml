# The host-browser panel lane relaxes exactly two shipped defaults, because
# both defaults are correct for a deployment and impossible for this scenario.
#
# `sandbox: none` passes `--no-sandbox` to the page process: Chromium refuses to
# start its own sandbox as root, and CI containers run as root. A deployment
# keeps the shipped `chromium` value.
#
# `allowPrivateAddresses: true` permits loopback destinations. The scenario
# serves its page from a throwaway `127.0.0.1` server so the request itself is
# the evidence of where the traffic came from; the shipped default refuses
# private and loopback hosts so that a page cannot reach the deployment's own
# network from the panel.
- id: browser-controller
  config:
    sandbox: none
    allowPrivateAddresses: true

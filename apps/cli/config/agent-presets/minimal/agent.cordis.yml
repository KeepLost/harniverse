# The `minimal` agent preset is a controlled two-tool coding composition.
#
# Its persona uses the same dynamic context path as every other Agent Profile.
# The shell is one-shot and platform-specific; filesystem reads and editor writes
# use the host sandbox provider. Automatic compaction remains an internal
# recovery service, without model-facing compaction or history tools.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    compactionHistory: true
  config:
    - id: compaction-lossless
      name: '@deepseek-ai/dsh-compaction-lossless'
      config:
        maxTokens: 131072

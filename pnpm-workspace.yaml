packages:
  - vendor/*
  - packages/*/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under native/landlock-run.
  - native/landlock-run
  - native/landlock-run/packages/*
  # Product assemblies over the package tier; apps/cli owns the `dsh` bin.
  - apps/*
  - website
  # The runnable demo leaves join as ONE workspace member: examples/package.json
  # declares the union of every leaf's cordis.yml plugins as workspace:*, so a
  # plain-node (`:lib`) boot of any leaf (examples/<leaf>/cordis.yml) resolves its
  # plugins through real package `exports`→lib by walking up to examples/node_modules.
  # Members for DEPENDENCY RESOLUTION only — NOT build targets: tsdown's explicit
  # globs (vendor/*, packages/*/*) exclude them. See examples/AGENTS.md and the archived
  # run-ci-examples-from-built-lib Agent Note.
  - examples
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

# Vendored framework packages keep their upstream semver ranges, while local
# builds must resolve those matching names to this workspace's pinned sources.
linkWorkspacePackages: true

overrides:
  # CVE-2026-93748 (GHSA-ch52-4w7c-c8xp): cacheable-request chain under
  # @electron/get (desktop packaging, dev-only) — force the patched release.
  'http-cache-semantics': '4.3.0'
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'
  # GHSA-22jm-h49p-29qw / GHSA-6prh-2h8m-c8cw / GHSA-rvq5-wwqv-78pq
  # (CVE-2026-111767/111769/111771): @modelcontextprotocol/sdk < 1.32.0
  # SSTI in tool descriptions and two request-forgery vectors; declared by
  # mcp-client and ssh plus transitive consumers — pin every resolution.
  '@modelcontextprotocol/sdk': '1.32.0'
  # GHSA-698v-4r3x-3vcv / GHSA-587h-7wmj-h5pm / GHSA-r825-w8mm-5pxw
  # (CVE-2026-112943/112942/112944): vite 8.0.0–8.1.5 — dev-server fs
  # exposure and request-smuggling in proxy mode; only the vitest chain
  # resolves the 8 line (apps pin vite 6), so scope the pin to it.
  'vite@8': '8.1.6'
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
  browserslist@4: 4.28.7
  # GHSA-c6gr-qvv4-5v3f / GHSA-cg2g-xh64-v4q7 / GHSA-mrv2-3pqr-j5jr:
  # dompurify <= 3.4.16 — SAFE_FOR_TEMPLATES and IN_PLACE sanitizer bypasses
  # plus an SMIL href guard skip; mermaid and vitepress chains resolve the
  # vulnerable line.
  dompurify: '3.4.17'
  # GHSA-rxp7-6hxx-x8q5: ip-address <= 10.7.3 quadratic zone-identifier
  # matching stalls the process; transitive under express-rate-limit,
  # mcp-client, ssh, and subagent packages.
  ip-address: '10.7.4'
  fast-uri@3: 3.1.8
  # GHSA-5r4p-p66f-jhc7 (CVE-2026-111757): hono < 4.13.11 DoS via
  # crafted multipart boundary — transitive under @modelcontextprotocol/sdk
  # and @hono/node-server; force the patched release.
  'hono@4': '4.13.11'
  js-yaml: '4.3.2'
  # CVE-2026-103923 (GHSA-238p-pmpm-9mq7): every katex before 0.18.2 is
  # affected, and the 0.16 line pulled in by mermaid and
  # micromark-extension-math has no patch release — collapse to one version.
  katex: '0.18.2'
  # GHSA-r4xh-jqrq-34v2: quadratic parse() in smol-toml <= 1.8.0.
  smol-toml: '1.9.0'
  # CVE-2026-93749 (GHSA-68fv-2mgg-jv7q): source-map-js < 1.2.2, reached
  # through postcss and the Vue compiler (build time only).
  source-map-js: '1.2.2'
  # GHSA-g2v6-rqmx-r4w6: @vue/server-renderer < 3.5.42 via vitepress
  # (documentation site build only); vue pins its @vue/* siblings exactly.
  vue: '3.5.42'
  nanoid: '3.3.18'
  postcss: '8.5.26'
  protobufjs: '7.6.5'
  qs@6: 6.16.0
  'undici@7': '7.29.1'
  'undici@8': 8.9.0
  undici8: 'undici@8.9.0'
  # GHSA-587h-7wmj-h5pm / GHSA-698v-4r3x-3vcv / GHSA-9jrq-w75r-8gcw /
  # GHSA-r825-w8mm-5pxw / GHSA-rq7h-c2jc-7f22: vite <= 6.4.3 — custom
  # middleware cross-origin script execution, server.fs.allow bypass, and
  # launch-editor command execution; scoped to the vitepress chain (apps pin
  # their own vite 6 in their manifests). Pinned to the same 6.4.5 the direct
  # manifests resolve so the vitepress chain and the website config share one
  # vite copy — a split (6.4.4 vs 6.4.5) makes their ViteDevServer types
  # structurally incompatible in .vitepress/config.ts.
  'vitepress>vite': '6.4.5'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) and lefthook
# (git hooks) genuinely need theirs.
allowBuilds:
  esbuild: true
  lefthook: true
  # electron-builder's Squirrel dependency is unused by our NSIS target.
  electron-winstaller: false
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # SSH transport's optional native crypto acceleration is built for the
  # local host; the transport still works with its pure-JavaScript fallback.
  ssh2: true
  cpu-features: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # The Python runtime deploy includes the reviewed workspace postinstall that
  # restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local@file:packages/subprocess/subprocess-local': true
  '@deepseek-ai/dsh-subprocess-local': true

minimumReleaseAgeExclude:
  # Fresh pi-ai releases carry the model catalog updates that are the whole
  # point of bumping it; waiting out the release age would defeat that.
  - '@earendil-works/pi-ai@0.87.1'
  # The only release fixing CVE-2026-93748 (GHSA-ch52-4w7c-c8xp) in the
  # desktop-packaging-only cacheable-request chain; pinned by the override above.
  - 'http-cache-semantics@4.3.0'
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4
  - http-cache-semantics@4.3.0
  - '@modelcontextprotocol/sdk@1.32.0'
  - hono@4.13.11
  - vite@8.1.6

patchedDependencies:
  '@earendil-works/pi-ai@0.87.1': patches/@earendil-works__pi-ai@0.87.1.patch
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
  openai@6.40.0: patches/openai@6.40.0.patch
